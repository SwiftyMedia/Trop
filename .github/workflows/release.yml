name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version (for example, 1.2.3). Leave blank to bump automatically.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: trop-release
  cancel-in-progress: false

env:
  FFMPEG_KIT_TAG: v9.0.0

jobs:
  release:
    name: Build and publish release
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Calculate release version
        id: version
        env:
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "Run releases from the main branch." >&2
            exit 1
          fi

          VERSION_DATA="$(python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          contents = Path("Trop.xcodeproj/project.pbxproj").read_text()
          versions = re.findall(
              r"MARKETING_VERSION = ([0-9]+\.[0-9]+\.[0-9]+);",
              contents,
          )
          if len(versions) != 2 or versions[0] != versions[1]:
              raise SystemExit(
                  "Expected matching MARKETING_VERSION values for Debug and Release."
              )

          requested = os.environ["REQUESTED_VERSION"].strip()
          if requested:
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", requested):
                  raise SystemExit(
                      "Release version must use MAJOR.MINOR.PATCH format (for example, 1.2.3)."
                  )
              version = requested
          else:
              parts = [int(part) for part in versions[0].split(".")]
              parts[2] += 1
              if parts[2] == 10:
                  parts[2] = 0
                  parts[1] += 1
              if parts[1] == 10:
                  parts[1] = 0
                  parts[0] += 1
              version = ".".join(map(str, parts))

          print(versions[0])
          print(version)
          PY
          )"
          OLD_VERSION="${VERSION_DATA%%$'\n'*}"
          VERSION="${VERSION_DATA#*$'\n'}"
          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists." >&2
            exit 1
          fi

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache ffmpeg-kit XCFrameworks
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-kit-xcframeworks
          key: ffmpeg-kit-${{ env.FFMPEG_KIT_TAG }}-arm64+sim-openssl-${{ runner.os }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build/DerivedDataApp
          key: trop-dd-${{ runner.os }}-${{ hashFiles('Trop.xcodeproj/**', '**/Package.resolved', 'Trop/**/*.swift') }}
          restore-keys: |
            trop-dd-${{ runner.os }}-

      - name: Make build script executable
        run: chmod +x ./build_ipa.sh

      - name: Download Discord Social SDK
        env:
          DISCORD_SOCIAL_SDK_URL: ${{ secrets.DISCORD_SOCIAL_SDK_URL }}
        run: |
          set -euo pipefail
          test -n "$DISCORD_SOCIAL_SDK_URL"
          ARCHIVE_PATH="$RUNNER_TEMP/discord-social-sdk.zip"
          EXTRACT_PATH="$RUNNER_TEMP/discord-social-sdk"
          rm -rf "$EXTRACT_PATH" build/discord
          mkdir -p "$EXTRACT_PATH" build/discord
          curl --fail --location --retry 3 --retry-delay 2 \
            --silent --show-error "$DISCORD_SOCIAL_SDK_URL" \
            --output "$ARCHIVE_PATH"
          unzip -q "$ARCHIVE_PATH" -d "$EXTRACT_PATH"
          SDK_PATH="$(find "$EXTRACT_PATH" -type d -name 'discord_partner_sdk.xcframework' -print -quit)"
          test -n "$SDK_PATH"
          mv "$SDK_PATH" build/discord/discord_partner_sdk.xcframework

      - name: Build release IPA
        run: ./build_ipa.sh
        env:
          FFMPEG_KIT_TAG: ${{ env.FFMPEG_KIT_TAG }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
          MARKETING_VERSION: ${{ steps.version.outputs.version }}

      - name: Commit release version to project
        env:
          OLD_VERSION: ${{ steps.version.outputs.old_version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Trop.xcodeproj/project.pbxproj")
          contents = path.read_text()
          old = f"MARKETING_VERSION = {os.environ['OLD_VERSION']};"
          new = f"MARKETING_VERSION = {os.environ['VERSION']};"
          updated, count = re.subn(re.escape(old), new, contents)
          if count != 2:
              raise SystemExit(
                  f"Expected exactly two old MARKETING_VERSION settings, found {count}."
              )
          path.write_text(updated)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Trop.xcodeproj/project.pbxproj
          if git diff --cached --quiet; then
            echo "Project version already matches v${VERSION}"
            exit 0
          fi
          git commit -m "chore(release): set version to v${VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Generate release notes from changes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(gh api "repos/${REPOSITORY}/releases/latest" --jq '.tag_name')"
          gh api --method POST "repos/${REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${VERSION}" \
            -f target_commitish=main \
            -f previous_tag_name="${PREVIOUS_TAG}" > release-notes-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path("release-notes-response.json").read_text())
          body = response["body"].strip()
          if not body:
              raise SystemExit("GitHub generated empty release notes; refusing to publish.")
          Path("release-notes.md").write_text(
              f"{body}\n\n[Discord](https://discord.gg/QrMwZAfU97)\n"
          )
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" build/Trop.ipa \
            --title "v${VERSION}" \
            --notes-file release-notes.md

      - name: Update AltStore source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          IPA_PATH="build/Trop.ipa"
          export SIZE="$(stat -f%z "$IPA_PATH")"
          export DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Trop.ipa"
          export RELEASE_NOTES="$(cat release-notes.md)"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("altstore.json")
          source = json.loads(path.read_text())
          app = source["apps"][0]
          entry = {
              "version": os.environ["VERSION"],
              "buildVersion": os.environ["BUILD_NUMBER"],
              "date": os.environ["DATE"],
              "localizedDescription": os.environ["RELEASE_NOTES"],
              "downloadURL": os.environ["DOWNLOAD_URL"],
              "size": int(os.environ["SIZE"]),
              "minOSVersion": "26.0",
          }
          app["versions"] = [entry]
          path.write_text(json.dumps(source, indent=2) + "\n")
          print(f"Updated altstore.json -> {entry['version']} ({entry['size']} bytes)")
          PY

      - name: Commit AltStore source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore.json
          if git diff --cached --quiet; then
            echo "altstore.json unchanged"
            exit 0
          fi
          git commit -m "altstore.json: publish release v${VERSION} [skip ci]"
          git push origin HEAD:main
