name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version (for example, 1.2.3). Leave blank to bump automatically from the latest GitHub release.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: trop-release
  cancel-in-progress: false

env:
  FFMPEG_KIT_TAG: v9.0.0

jobs:
  release:
    name: Build and publish release
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          # Full history so post-release rebase/push cannot drop earlier bot commits.
          fetch-depth: 0

      - name: Calculate release version
        id: version
        env:
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "Run releases from the main branch." >&2
            exit 1
          fi

          LATEST_TAG="$(gh api "repos/${REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ ! "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest release tag must look like v1.2.3, got: ${LATEST_TAG}" >&2
            exit 1
          fi
          export LATEST_VERSION="${LATEST_TAG#v}"

          VERSION="$(python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          contents = Path("Trop.xcodeproj/project.pbxproj").read_text()
          versions = re.findall(
              r"MARKETING_VERSION = ([0-9]+\.[0-9]+\.[0-9]+);",
              contents,
          )
          if len(versions) != 2 or versions[0] != versions[1]:
              raise SystemExit(
                  "Expected matching MARKETING_VERSION values for Debug and Release."
              )

          def parse(version: str) -> tuple[int, int, int]:
              major, minor, patch = (int(part) for part in version.split("."))
              return major, minor, patch

          def bump(version: str) -> str:
              major, minor, patch = parse(version)
              patch += 1
              if patch == 10:
                  patch = 0
                  minor += 1
              if minor == 10:
                  minor = 0
                  major += 1
              return f"{major}.{minor}.{patch}"

          requested = os.environ["REQUESTED_VERSION"].strip()
          latest = os.environ["LATEST_VERSION"]
          marketing = versions[0]

          if requested:
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", requested):
                  raise SystemExit(
                      "Release version must use MAJOR.MINOR.PATCH format (for example, 1.2.3)."
                  )
              version = requested
          else:
              # GitHub releases are source of truth; MARKETING_VERSION can lag after manual releases.
              base = max(latest, marketing, key=parse)
              version = bump(base)

          print(version)
          PY
          )"
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists." >&2
            exit 1
          fi

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache ffmpeg-kit XCFrameworks
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-kit-xcframeworks
          key: ffmpeg-kit-${{ env.FFMPEG_KIT_TAG }}-arm64+sim-openssl-${{ runner.os }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build/DerivedDataApp
          key: trop-dd-${{ runner.os }}-${{ hashFiles('Trop.xcodeproj/**', '**/Package.resolved', 'Trop/**/*.swift') }}
          restore-keys: |
            trop-dd-${{ runner.os }}-

      - name: Make build script executable
        run: chmod +x ./build_ipa.sh

      - name: Fetch Discord Social SDK
        uses: ./.github/actions/fetch-discord-sdk
        with:
          url: ${{ secrets.DISCORD_SOCIAL_SDK_URL }}
          cache-version: "1"

      - name: Build release IPA
        run: ./build_ipa.sh
        env:
          FFMPEG_KIT_TAG: ${{ env.FFMPEG_KIT_TAG }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
          MARKETING_VERSION: ${{ steps.version.outputs.version }}

      - name: Generate release notes from changes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.latest_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${VERSION}" \
            -f target_commitish=main \
            -f previous_tag_name="v${PREVIOUS_VERSION}" > release-notes-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path("release-notes-response.json").read_text())
          body = response["body"].strip()
          if not body:
              raise SystemExit("GitHub generated empty release notes; refusing to publish.")
          Path("release-notes.md").write_text(
              f"{body}\n\n[Discord](https://discord.gg/QrMwZAfU97)\n"
          )
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" build/Trop.ipa \
            --title "v${VERSION}" \
            --notes-file release-notes.md

      - name: Update project version and AltStore source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Refuse to publish an AltStore entry until the release asset actually exists.
          ASSET_NAME="$(gh api "repos/${REPOSITORY}/releases/tags/v${VERSION}" \
            --jq '.assets[] | select(.name == "Trop.ipa") | .name')"
          if [[ "$ASSET_NAME" != "Trop.ipa" ]]; then
            echo "Release v${VERSION} has no Trop.ipa asset; refusing to update altstore.json." >&2
            exit 1
          fi

          IPA_PATH="build/Trop.ipa"
          export SIZE="$(stat -f%z "$IPA_PATH")"
          export DATE="$(gh api "repos/${REPOSITORY}/releases/tags/v${VERSION}" --jq '.published_at')"
          export DOWNLOAD_URL="https://github.com/${REPOSITORY}/releases/download/v${VERSION}/Trop.ipa"
          export RELEASE_NOTES="$(cat release-notes.md)"
          export VERSION

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]

          pbxproj = Path("Trop.xcodeproj/project.pbxproj")
          contents = pbxproj.read_text()
          updated, count = re.subn(
              r"MARKETING_VERSION = [0-9]+\.[0-9]+\.[0-9]+;",
              f"MARKETING_VERSION = {version};",
              contents,
          )
          if count != 2:
              raise SystemExit(
                  f"Expected exactly two MARKETING_VERSION settings, found {count}."
              )
          pbxproj.write_text(updated)

          path = Path("altstore.json")
          source = json.loads(path.read_text())
          app = source["apps"][0]
          entry = {
              "version": version,
              "buildVersion": os.environ["BUILD_NUMBER"],
              "date": os.environ["DATE"],
              "localizedDescription": os.environ["RELEASE_NOTES"],
              "downloadURL": os.environ["DOWNLOAD_URL"],
              "size": int(os.environ["SIZE"]),
              "minOSVersion": "26.0",
          }
          app["versions"] = [entry]
          path.write_text(json.dumps(source, indent=2) + "\n")
          print(f"Updated altstore.json -> {entry['version']} ({entry['size']} bytes)")
          PY

      - name: Commit release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Trop.xcodeproj/project.pbxproj altstore.json
          if git diff --cached --quiet; then
            echo "Release metadata already matches v${VERSION}"
            exit 0
          fi
          git commit -m "chore(release): publish v${VERSION} metadata [skip ci]"
          # Rebase onto latest main so a concurrent push cannot orphan this commit.
          git pull --rebase origin main
          git push origin HEAD:main
